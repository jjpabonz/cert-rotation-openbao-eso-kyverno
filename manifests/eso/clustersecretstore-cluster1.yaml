# Tells External Secrets Operator where OpenBao is and how to authenticate (cluster 1).
# OpenBao is API-compatible with Vault, so the `vault` provider is used.
# `server` is the address of OpenBao. It must match the Ingress host set in helm/openbao-values.yaml.
# ESO logs in with its own service account through the `kubernetes` auth method created by tofu/main.tf.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "http://openbao.kube1.example.com"
      path: certificates    # KV v2 mount
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-role
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
