# Act 2: copies the OpenBao entry certificates/demo/tls into two Kubernetes Secrets and keeps them in sync:
#   demo-tls -> tls.crt and tls.key (used by the Ingress)
#   demo-ca  -> ca.crt              (used by curl)
#
# creationPolicy: Merge -> the Secrets already exist (created by hand with version 1),
# ESO only updates their keys. It never creates or deletes the Secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-tls
  namespace: demo
spec:
  refreshInterval: 15s      # short on purpose, for the recording
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: demo-tls
    creationPolicy: Merge
  data:
    - secretKey: tls.crt
      remoteRef:
        key: demo/tls
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: demo/tls
        property: tls.key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-ca
  namespace: demo
spec:
  refreshInterval: 15s
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: demo-ca
    creationPolicy: Merge
  data:
    - secretKey: ca.crt
      remoteRef:
        key: demo/tls
        property: ca.crt
