apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: nginx-html
    namespace: demo
    literals:
      - index.html=Hi! from Kube 1
patches:
  - target:
      kind: Ingress
      name: demo
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: demo.kube1.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: demo.kube1.example.com
  - target:
      kind: Deployment
      name: curl
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: curl
      spec:
        template:
          spec:
            containers:
              - name: curl
                env:
                  - name: DEMO_HOST
                    value: demo.kube1.example.com
