# HTTPS with the Secret demo-tls. The host is set per cluster in ../cluster1 and ../cluster2.
# Add `ingressClassName: <your class>` under spec if your cluster has no default IngressClass.
# Whether the controller reloads the certificate by itself when the Secret changes depends on
# the controller; the demo assumes it does (no Kyverno policy for that part).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo
  namespace: demo
spec:
  tls:
    - hosts:
        - CHANGE-ME
      secretName: demo-tls
  rules:
    - host: CHANGE-ME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
