# One replica per controller is enough for a demo.
admissionController:
  replicas: 1
backgroundController:
  replicas: 1
  # The background controller mutates existing resources (see manifests/kyverno), so it needs
  # permission to update Deployments. This is cluster-wide; the policy itself only touches
  # deployment/curl in namespace demo.
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: ["apps"]
          resources: ["deployments"]
          verbs: ["get", "list", "watch", "update", "patch"]
cleanupController:
  enabled: false
reportsController:
  enabled: false
